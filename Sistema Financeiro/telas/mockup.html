<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jornada do M1lhão — Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --panel:#151515; --panel-2:#1C1C1C; --panel-3:#232323;
  --ink:#FFFFFF; --ink-soft:#B3B3B3; --ink-faint:#6E6E6E; --line:#2A2A2A;
  --dourado:#FED116; --dourado-soft:rgba(254,209,22,.13); --dourado-deep:#D9AE00;
  --credit:#22C55E; --credit-soft:rgba(34,197,94,.15);
  --debit:#EF4444; --debit-soft:rgba(239,68,68,.15);
  --warn:#F59E0B; --warn-soft:rgba(245,158,11,.15);
  --info:#3B82F6; --info-soft:rgba(59,130,246,.15);
  --radius:14px;
  --display:'Sora',sans-serif; --sans:'Manrope',sans-serif; --mono:'IBM Plex Mono',monospace;
  --rail:68px;
  --ease:cubic-bezier(.22,.9,.28,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ============ fundo animado ============ */
#fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fundo .bussola{
  position:absolute;right:-14%;top:48%;width:min(84vh,920px);
  transform-origin:50% 50%;opacity:.075;
  animation:girar 240s linear infinite;
}
#fundo .bussola img{width:100%;display:block}
#fundo .brilho{
  position:absolute;width:70vw;height:70vw;border-radius:50%;
  background:radial-gradient(circle,rgba(254,209,22,.16) 0%,rgba(254,209,22,.05) 38%,transparent 68%);
  left:-18vw;top:-26vw;animation:respirar 16s ease-in-out infinite;
}
#fundo .brilho.b2{
  left:auto;right:-22vw;top:auto;bottom:-30vw;width:58vw;height:58vw;
  background:radial-gradient(circle,rgba(254,209,22,.11) 0%,transparent 66%);
  animation-duration:22s;animation-delay:-7s;
}
#fundo .malha{
  position:absolute;inset:0;opacity:.6;
  background-image:linear-gradient(rgba(254,209,22,.030) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(254,209,22,.030) 1px,transparent 1px);
  background-size:62px 62px;
  mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 25%,transparent 82%);
  animation:deslizar 60s linear infinite;
}
/* carta náutica: rota tracejada, marcações e curvas de profundidade */
#fundo .carta{position:absolute;inset:0;width:100%;height:100%}
#fundo .rota{fill:none;stroke:rgba(254,209,22,.34);stroke-width:2.2;stroke-linecap:round;
  stroke-dasharray:13 15;animation:andar 26s linear infinite}
#fundo .rota-2{stroke:rgba(254,209,22,.2);stroke-width:1.6;stroke-dasharray:7 12;animation-duration:38s;animation-direction:reverse}
#fundo .costa{fill:none;stroke:rgba(254,209,22,.12);stroke-width:1.4}
#fundo .costa.c2{stroke:rgba(254,209,22,.075)}
#fundo .costa.c3{stroke:rgba(254,209,22,.05)}
#fundo .xis{stroke:rgba(254,209,22,.5);stroke-width:3.4;stroke-linecap:round;
  transform-origin:center;animation:pulsar 4.5s ease-in-out infinite}
#fundo .marco{fill:rgba(254,209,22,.42);animation:pulsar 5.5s ease-in-out infinite}
#fundo .anel{fill:none;stroke:rgba(254,209,22,.3);stroke-width:1.6;
  transform-box:fill-box;transform-origin:center;animation:onda 5s ease-out infinite}
@keyframes girar{to{transform:translateY(-50%) rotate(360deg)}}
@keyframes respirar{0%,100%{transform:scale(1);opacity:.75}50%{transform:scale(1.16);opacity:1}}
@keyframes deslizar{to{background-position:62px 62px,62px 62px}}
@keyframes andar{to{stroke-dashoffset:-560}}
@keyframes pulsar{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes onda{0%{transform:scale(.5);opacity:.55}100%{transform:scale(2.3);opacity:0}}

/* ============ shell ============ */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.rail{width:var(--rail);background:rgba(21,21,21,.78);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px;position:sticky;top:0;height:100vh;z-index:10}
.rail .mark{width:40px;height:40px;margin-bottom:14px;flex:none;position:relative;cursor:pointer}
.rail .mark img{width:100%;height:100%;object-fit:contain;transition:transform .7s var(--ease)}
.rail .mark:hover img{transform:rotate(90deg)}
.rail button{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink-faint);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease);position:relative}
.rail button:hover{background:var(--panel-2);color:var(--ink-soft);transform:translateX(2px)}
.rail button:active{transform:scale(.92)}
.rail button.on{background:var(--dourado-soft);color:var(--dourado)}
.rail button.on::before{content:"";position:absolute;left:-12px;top:50%;height:0;width:3px;border-radius:0 3px 3px 0;background:var(--dourado);transform:translateY(-50%);animation:marca .3s var(--ease) forwards}
@keyframes marca{to{height:22px}}
.rail svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .sep{flex:1}
.rail .tip{position:absolute;left:54px;background:var(--panel-3);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:12px;white-space:nowrap;opacity:0;transform:translateX(-6px);pointer-events:none;transition:.2s var(--ease);color:var(--ink);z-index:20}
.rail button:hover .tip{opacity:1;transform:translateX(0)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ============ topo ============ */
.top{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(21,21,21,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:9}
.brand{display:flex;align-items:center;gap:15px}
.brand .wm{height:30px;display:block}
.brand .div{width:1px;height:28px;background:var(--line)}
.brand .ph{height:28px;padding:0 12px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:10.5px;color:var(--ink-faint);letter-spacing:.7px}
.top .sp{flex:1}
.pill{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:.2s var(--ease)}
.pill:hover{border-color:var(--ink-faint);color:var(--ink)}
.pill:active{transform:scale(.96)}
.pill svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.pill.on{background:var(--dourado);color:#0A0A0A;border-color:var(--dourado);font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--panel-3);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:.2s}
.av:hover{border-color:var(--dourado);color:var(--dourado)}

/* ============ conteúdo ============ */
.body{padding:24px 28px 60px;max-width:1340px;width:100%}
.h1{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.3px}
.sub{color:var(--ink-faint);font-size:13px;margin-top:3px}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.head .sp{flex:1}
.btn{height:36px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--sans);transition:.2s var(--ease)}
.btn:hover{border-color:var(--ink-faint);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.btn.pri{background:var(--dourado);color:#0A0A0A;border-color:var(--dourado);font-weight:600}
.btn.pri:hover{background:#FFDC44;box-shadow:0 6px 20px rgba(254,209,22,.22)}

.card{background:rgba(21,21,21,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;transition:border-color .25s,transform .25s var(--ease)}
.card:hover{border-color:#343434}
.grid{display:grid;gap:14px}

/* entrada escalonada */
.anim{opacity:0;transform:translateY(14px);animation:subir .5s var(--ease) forwards}
@keyframes subir{to{opacity:1;transform:translateY(0)}}

/* KPI */
.kpi .lab{font-size:11.5px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase}
.kpi .val{font-family:var(--mono);font-size:27px;font-weight:600;margin-top:9px;letter-spacing:-.6px}
.kpi .leg{font-size:12px;color:var(--ink-soft);margin-top:7px;line-height:1.45}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;font-family:var(--mono)}
.tag.up{background:var(--credit-soft);color:var(--credit)}
.tag.dn{background:var(--debit-soft);color:var(--debit)}
.tag.nt{background:var(--panel-3);color:var(--ink-soft)}
.tag.wr{background:var(--warn-soft);color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--panel-3);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--dourado);width:0;animation:encher 1s var(--ease) forwards}
@keyframes encher{to{width:var(--w)}}

/* cadeia */
.dre .row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.dre .row:last-child{border-bottom:0}
.dre .row .nm{flex:1;font-size:13.5px;color:var(--ink-soft)}
.dre .row .vl{font-family:var(--mono);font-size:14.5px;color:var(--ink-soft)}
.dre .row.neg .vl{color:var(--debit)}
.dre .row.tot{padding:15px 0}
.dre .row.tot .nm{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.2px}
.dre .row.tot .vl{font-size:20px;font-weight:600;color:var(--ink)}
.dre .row.tot.gold{border-top:1px solid var(--line)}
.dre .row.tot.gold .vl{color:var(--dourado)}

/* ============ gráfico de linha ============ */
.lc{position:relative;width:100%}
.lc svg{width:100%;display:block;overflow:visible}
.lc .linha{fill:none;stroke:var(--dourado);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:tracar 1.1s var(--ease) forwards}
@keyframes tracar{to{stroke-dashoffset:0}}
.lc .area{fill:url(#gradLinha);opacity:0;animation:aparecer .7s .5s ease forwards}
@keyframes aparecer{to{opacity:1}}
.lc .pt{fill:var(--bg);stroke:var(--dourado);stroke-width:2.2;cursor:pointer;transition:r .18s var(--ease),fill .18s;opacity:0;animation:aparecer .3s forwards}
.lc .pt:hover{r:6.5;fill:var(--dourado)}
.lc .pt.sel{fill:var(--dourado);r:6}
.lc .hit{fill:transparent;cursor:pointer}
.lc .hit:hover ~ .col{opacity:1}
.lc .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.lc .xl{font-size:11px;fill:var(--ink-faint);font-family:var(--sans);text-anchor:middle;cursor:pointer;transition:fill .2s}
.lc .xl:hover{fill:var(--ink-soft)}
.lc .xl.sel{fill:var(--dourado);font-weight:700}
.lc .yl{font-size:10px;fill:var(--ink-faint);font-family:var(--mono);text-anchor:end}
.lc .vazio{font-size:11px;fill:var(--ink-faint);font-family:var(--sans);text-anchor:middle}
.lcdica{position:absolute;pointer-events:none;background:var(--panel-3);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;opacity:0;transform:translate(-50%,-118%);transition:opacity .15s;white-space:nowrap;z-index:5}
.lcdica .v{font-family:var(--mono);font-weight:600;color:var(--dourado);font-size:13px;display:block;margin-top:2px}

.migalha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);font-size:12.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:var(--sans);transition:.2s var(--ease)}
.chip:hover{border-color:var(--ink-faint);color:var(--ink)}
.chip.on{background:var(--dourado-soft);border-color:rgba(254,209,22,.35);color:var(--dourado);font-weight:600}
.chip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* barras mês a mês */
.chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;cursor:pointer}
.chart .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;flex:1}
.chart .b{width:64%;border-radius:5px 5px 0 0;background:var(--panel-3);transform-origin:bottom;animation:crescer .7s var(--ease) forwards;transform:scaleY(0)}
.chart .col:hover .b{filter:brightness(1.35)}
.chart .col.hot .b{background:var(--dourado)}
.chart .lb{font-size:11px;color:var(--ink-faint);letter-spacing:.4px}
@keyframes crescer{to{transform:scaleY(1)}}

/* rosca */
.rosca circle{transition:stroke-width .2s var(--ease)}
.rosca circle.f{stroke-dasharray:var(--da);stroke-dashoffset:var(--c);animation:arco 1s var(--ease) forwards}
@keyframes arco{to{stroke-dashoffset:var(--do)}}
.leg-row{display:flex;align-items:center;gap:10px;padding:7px 10px;margin:0 -10px;border-bottom:1px solid var(--line);
  transition:background .18s,transform .18s var(--ease);border-radius:8px}
.leg-row.fat{cursor:pointer}
.leg-row.fat:hover,.leg-row.fat.rea{background:rgba(255,255,255,.055)}
.leg-row .seta{width:14px;height:14px;flex:none;color:var(--ink-faint);opacity:0;transform:translateX(-4px);transition:.18s var(--ease)}
.leg-row.fat:hover .seta,.leg-row.fat.rea .seta{opacity:1;transform:translateX(0);color:var(--dourado)}

/* linhas da DRE clicáveis */
.dre .row.ab{cursor:pointer;padding-left:10px;padding-right:10px;margin:0 -10px;border-radius:8px;
  transition:background .18s var(--ease)}
.dre .row.ab:hover{background:rgba(255,255,255,.055)}
.dre .row .seta{width:15px;height:15px;flex:none;color:var(--ink-faint);opacity:0;transform:translateX(-4px);transition:.18s var(--ease)}
.dre .row.ab:hover .seta{opacity:1;transform:translateX(0);color:var(--dourado)}

/* fatia da rosca em realce */
.rosca circle.fat{cursor:pointer}
.rosca circle.fat.rea{stroke-width:17}
.rosca circle.fat.apaga{opacity:.28}

/* tabela */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.5px;text-transform:uppercase;padding:0 12px 11px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:13px 12px;border-bottom:1px solid var(--line);font-size:13.5px}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .18s}
tbody tr:hover{background:var(--panel-2)}
tbody tr:active{background:var(--panel-3)}
td.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px}
.who .ci{width:30px;height:30px;border-radius:9px;background:var(--panel-3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-soft);flex:none;transition:.2s}
tbody tr:hover .who .ci{background:var(--dourado-soft);color:var(--dourado)}
.who .nm2{font-weight:500}
.who .sb{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.vazia{padding:42px 12px;text-align:center;color:var(--ink-faint);font-size:13px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-faint);padding:9px 14px;font-size:13.5px;font-family:var(--sans);font-weight:500;cursor:pointer;margin-bottom:-1px;transition:.2s}
.tabs button:hover{color:var(--ink-soft)}
.tabs button.on{color:var(--dourado);border-bottom-color:var(--dourado)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.74);backdrop-filter:blur(3px);display:grid;place-items:center;padding:30px;z-index:50;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);max-height:88vh;overflow:auto;
  animation:pular .32s var(--ease)}
@keyframes pular{from{opacity:0;transform:translateY(22px) scale(.97)}}
.modal header{display:flex;align-items:flex-start;gap:14px;padding:20px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal header h3{font-family:var(--display);font-size:17px;font-weight:700}
.modal header .sb{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.modal .cnt{padding:20px 24px}
.modal footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--panel)}
.x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-soft);display:grid;place-items:center;cursor:pointer;transition:.2s}
.x:hover{color:var(--ink);border-color:var(--ink-faint);transform:rotate(90deg)}
.x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}

.field{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .fl{width:170px;font-size:13px;color:var(--ink-soft);flex:none}
.inp{flex:1;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:0 12px;font-family:var(--mono);font-size:13.5px;display:flex;align-items:center;transition:.2s}
.inp:hover{border-color:var(--ink-faint)}
.inp.ph{color:var(--ink-faint)}
.calc{flex:1;height:36px;display:flex;align-items:center;padding:0 12px;font-family:var(--mono);font-size:13.5px;color:var(--ink-soft);background:repeating-linear-gradient(-45deg,transparent,transparent 5px,rgba(255,255,255,.018) 5px,rgba(255,255,255,.018) 10px);border-radius:9px;border:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{background:var(--panel-2);border:0;color:var(--ink-faint);padding:0 12px;height:36px;font-size:12.5px;font-family:var(--sans);cursor:pointer;transition:.2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--dourado);color:#0A0A0A;font-weight:600}
.addline{width:100%;height:38px;border:1px dashed var(--line);background:transparent;border-radius:10px;color:var(--ink-faint);font-size:13px;font-family:var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;transition:.2s var(--ease)}
.addline:hover{color:var(--dourado);border-color:var(--dourado);background:var(--dourado-soft)}
.addline svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}

.blk{font-size:11.5px;font-weight:600;color:var(--ink-faint);letter-spacing:.6px;text-transform:uppercase;margin:22px 0 10px}
.blk:first-child{margin-top:0}
.viv{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:18px;margin-top:16px;flex-wrap:wrap}
.viv .it{flex:1;min-width:110px}
.viv .it .l{font-size:11.5px;color:var(--ink-faint)}
.viv .it .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:4px}
.viv .it .v.gold{color:var(--dourado)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--dourado);position:relative;flex:none;cursor:pointer;transition:background .25s}
.switch i{position:absolute;top:3px;left:21px;width:18px;height:18px;border-radius:50%;background:#0A0A0A;transition:left .25s var(--ease)}
.switch.off{background:var(--panel-3)}
.switch.off i{left:3px;background:var(--ink-faint)}
.hide{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:30px;position:relative;z-index:1}
.login .box{width:min(400px,100%);text-align:center}
.login .lg{width:112px;margin:0 auto 20px;animation:entrarLg .9s var(--ease)}
@keyframes entrarLg{from{opacity:0;transform:rotate(-24deg) scale(.86)}}
.login .lg img{width:100%;display:block}
.login .wm{width:200px;margin:0 auto 6px}
.login p{color:var(--ink-faint);font-size:13.5px;margin-top:10px;line-height:1.55}
.login .frm{margin-top:26px;text-align:left;display:flex;flex-direction:column;gap:11px}
.login .frm .inp{height:44px;font-family:var(--sans)}
.login .btn{height:44px;justify-content:center;margin-top:5px}

/* barra inferior do celular */
.tabbar{display:none}
@media(max-width:900px){
  .rail{display:none}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:14px;z-index:40;
    background:rgba(28,28,28,.93);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:999px;padding:7px;gap:3px;align-items:center;justify-content:space-between;
    box-shadow:0 10px 34px rgba(0,0,0,.55)}
  .tabbar button{flex:1;min-width:0;height:46px;border:0;border-radius:999px;background:transparent;
    color:var(--ink-faint);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
    font-family:var(--sans);font-size:13px;font-weight:600;padding:0;position:relative;
    transition:flex .3s var(--ease),background .25s,color .25s}
  .tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .tabbar button span{display:none;white-space:nowrap}
  .tabbar button.on{background:var(--dourado);color:#0A0A0A;flex:2.1;padding:0 16px}
  .tabbar button.on span{display:inline;animation:aparecer .25s .08s both}
  .tabbar button .dot{position:absolute;top:9px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--debit);border:2px solid #1C1C1C}
  .tabbar button.on .dot{display:none}
  .grid{grid-template-columns:minmax(0,1fr)!important}
  .body{padding:18px 16px 104px}
  .top{padding:11px 16px;gap:10px}
  .dre .row{flex-wrap:wrap;gap:4px}
  .dre .row .nm{flex:1 1 100%}
  .dre .row .vl{flex:1;text-align:right}
  .card>div[style*="margin:18px -20px"]{margin-left:-16px!important;margin-right:-16px!important;padding-left:16px!important;padding-right:16px!important}
  .rosca{margin:0 auto}
  .leg-row{flex-wrap:wrap}
  .lc svg{height:170px!important}
  .brand .wm{height:24px}
  .brand .ph,.top .pill:nth-of-type(2){display:none}
  .head{flex-wrap:wrap}.h1{font-size:20px}
  .card{padding:15px 16px}.kpi .val{font-size:22px}
  table{font-size:12.5px}th{font-size:10.5px}
  .modal{border-radius:0;width:100%;max-height:100vh;height:100vh}
  .scrim{padding:0}
  .field{flex-wrap:wrap}.field .fl{width:100%}
  #fundo .bussola{right:-42%;width:130vw;opacity:.028}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

   ajustadas proporcionalmente pra fechar no total que a empresa usa */
const RES = {};
for(const m in BRUTO){
  const b = BRUTO[m];
  const linhas = FIXOS[m], soma = Object.values(linhas).reduce((a,c)=>a+c,0);
  const k = b.cf/soma;
  const ajust = {}; for(const n in linhas) ajust[n] = linhas[n]*k;
  const imposto = Object.entries(ajust).filter(([n])=>/imposto/i.test(n)).reduce((a,[,v])=>a+v,0);
  const naoPrev = (NAOPREV[m]||[]).reduce((a,c)=>a+c.v,0);
  RES[m] = {
    venda:b.venda, lb:b.lb, com:b.com,
    base: b.venda-b.lb-b.com,
    fixos: ajust, cf:b.cf, imposto, cfSemImposto: b.cf-imposto,
    naoPrev, naoPrevItens:(NAOPREV[m]||[]),
    ll: b.lb - naoPrev - b.cf
  };
}

/* meses sem identificação de cliente na origem: vendas geradas a partir do
   total e da contagem reais, pra lista e gráfico responderem ao filtro */
function espalhar(m, n, unids){
  const total = RES[m].venda, custoReal = total - RES[m].lb;
  let sv = 0, sc = 0, semente = m.charCodeAt(0)*31 + n;
  const rnd = () => (semente = (semente*1103515245 + 12345) % 2147483648) / 2147483648;
  const pesos = Array.from({length:n}, () => .6 + rnd()*.9);
  const soma = pesos.reduce((a,b)=>a+b,0);
  const dias = Array.from({length:n}, () => 2 + Math.floor(rnd()*26)).sort((a,b)=>a-b);
  return pesos.map((p,i)=>{
    const ult = i===n-1;
    const val   = ult ? total-sv      : Math.round(total*p/soma);
    const custo = ult ? custoReal-sc  : Math.round(custoReal*p/soma);
    sv += val; sc += custo;
    return {c:`Venda ${i+1} de ${MES_NOME[m]}`, v:'—', u:unids[i%unids.length], m, dia:dias[i],
            kwp:Math.round((val/2600)*100)/100, val, custo, lb:val-custo, p:0, anon:1};
  });
}
const VENDAS = [
  ...espalhar('FEV', 6,  ['Unidade A','Unidade B']),
  ...espalhar('MAR', 10, ['Unidade A','Unidade B']),
  ...espalhar('ABR', 9,  ['Unidade A','Unidade B']),
  ...espalhar('MAI', 6,  ['Unidade A']),

function fatias(m){

/* ============ estado do filtro ============ */
const S = { tela:'visao', mes:'JUL', dia:null, abaFixos:'fixo', unidade:'todas' };

function filtradas(){
  return VENDAS.filter(x => x.m===S.mes
    && (S.dia===null || x.dia===S.dia)
    && (S.unidade==='todas' || x.u===S.unidade));
}
function rotuloPeriodo(){
  if(S.dia) return `${String(S.dia).padStart(2,'0')} de ${MES_NOME[S.mes]} de 2026`;
  return `${MES_NOME[S.mes][0].toUpperCase()+MES_NOME[S.mes].slice(1)} de 2026`;
}

/* ============ gráfico de linha ============ */
function linhaSVG(pontos, opt){
  const W = 1000, H = opt.h || 210, PL = 54, PR = 16, PT = 16, PB = 30;
  const iw = W-PL-PR, ih = H-PT-PB;
  const max = Math.max(...pontos.map(p=>p.v), 1);
  const esc = v => PT + ih - (v/max)*ih;
  const px  = i => pontos.length===1 ? PL+iw/2 : PL + (i/(pontos.length-1))*iw;

  const coords = pontos.map((p,i)=>[px(i), esc(p.v)]);
  const d = coords.map((c,i)=>`${i?'L':'M'}${c[0].toFixed(1)} ${c[1].toFixed(1)}`).join(' ');
  const dArea = `${d} L${coords[coords.length-1][0].toFixed(1)} ${PT+ih} L${coords[0][0].toFixed(1)} ${PT+ih} Z`;
  const len = coords.reduce((s,c,i)=> i? s+Math.hypot(c[0]-coords[i-1][0], c[1]-coords[i-1][1]) : 0, 0);

  const grades = [0,.5,1].map(f=>`<line class="gl" x1="${PL}" x2="${W-PR}" y1="${PT+ih-f*ih}" y2="${PT+ih-f*ih}"/>
    <text class="yl" x="${PL-9}" y="${PT+ih-f*ih+3.5}">${f? BRLc(max*f).replace('R$ ','') : '0'}</text>`).join('');

  const rot = pontos.map((p,i)=>`<text class="xl ${p.sel?'sel':''}" x="${px(i)}" y="${H-9}"
      data-idx="${i}">${p.r}</text>`).join('');

  const pts = pontos.map((p,i)=>`<circle class="pt ${p.sel?'sel':''}" cx="${px(i)}" cy="${esc(p.v)}" r="${p.sel?6:4.2}"
      style="animation-delay:${.5+i*.035}s" data-idx="${i}"
      data-rot="${p.rd||p.r}" data-val="${p.v}"/>`).join('');

  const semDado = pontos.every(p=>p.v===0)
    ? `<text class="vazio" x="${W/2}" y="${PT+ih/2}">Nenhuma venda no período</text>` : '';

  return `<div class="lc" data-lc="${opt.id}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
      <defs><linearGradient id="gradLinha" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FED116" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#FED116" stop-opacity="0"/>
      </linearGradient></defs>
      ${grades}
      ${semDado ? '' : `<path class="area" d="${dArea}"/><path class="linha" d="${d}" style="--len:${len.toFixed(0)}"/>`}
      ${semDado}
      ${pts}${rot}
    </svg>
  </div>`;
}

function dadosAno(){

function dadosDias(){
  const dias = Array.from({length:30},(_,i)=>i+1);

    rd:`${String(d).padStart(2,'0')}/${String(MESES_ORD.indexOf(S.mes)+1).padStart(2,'0')}`,
    v: doMes.filter(x=>x.dia===d).reduce((s,x)=>s+x.val,0),
    sel: S.dia===d, chave:d
  }));
}

/* ============ KPIs derivados do filtro ============ */
function kpis(){
  const f = filtradas();
  const total = f.reduce((s,x)=>s+x.val,0);
  const custo = f.reduce((s,x)=>s+x.custo,0);
  const lb = total-custo;
  const pend = f.reduce((s,x)=>s+x.p,0);
  const maior = f.slice().sort((a,b)=>b.val-a.val)[0];
  return {n:f.length, total, custo, lb, pend, maior,
          ticket: f.length? total/f.length : 0,
          margem: total? lb/total*100 : 0};
}

const setinha = () => `<svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>`;

/* ============ rosca ============ */
function rosca(){
  const F = fatias(S.mes), r = RES[S.mes];
  const tot = F.reduce((s,f)=>s+f.v,0);
  const R = 60, W = 12, C = 2*Math.PI*R;
  let off = 0;
  const arcos = F.map((f,i)=>{
    const frac = f.v/tot;
    const el = `<circle class="f fat" data-fat="${f.k}" cx="78" cy="78" r="${R}" fill="none" stroke="${f.c}" stroke-width="${W}"
      style="--da:${(frac*C).toFixed(2)} ${C.toFixed(2)};--c:${C.toFixed(2)};--do:${(-off*C).toFixed(2)};animation-delay:${.25+i*.1}s"
      transform="rotate(-90 78 78)"></circle>`;
    off += frac; return el;
  }).join('');
  const legenda = F.map(f=>{
    const pct = f.v/tot*100;
    return `<div class="leg-row fat" data-fat="${f.k}">
      <i style="width:9px;height:9px;border-radius:2px;background:${f.c};flex:none"></i>
      <div style="flex:1;min-width:0"><div style="font-size:13px">${f.n}</div>
        ${f.d?`<div style="font-size:11px;color:var(--ink-faint);margin-top:1px">${f.d}</div>`:''}</div>
      <div class="num" style="font-size:13px;font-weight:600;width:50px;text-align:right;color:${f.c==='#EF4444'?'var(--debit)':'var(--ink)'}">${pct.toFixed(1).replace('.',',')}%</div>
      <div class="num" style="font-size:12.5px;color:var(--ink-soft);width:100px;text-align:right">${BRL(f.v)}</div>
      ${setinha()}
    </div>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <div class="rosca" style="position:relative;width:156px;height:156px;flex:none">
      <svg viewBox="0 0 156 156" style="width:156px;height:156px">${arcos}</svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none">
        <div style="font-size:9.5px;color:var(--ink-faint);letter-spacing:.5px">CUSTO TOTAL</div>
        <div class="num" style="font-size:16px;font-weight:600;margin-top:3px">R$ ${(tot/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}<span style="font-size:11px;color:var(--ink-faint)"> mil</span></div>
        <div style="font-size:9.5px;color:var(--ink-faint);margin-top:3px">${(tot/r.venda*100).toFixed(1).replace('.',',')}% da receita</div>
      </div>
    </div>
    <div style="flex:1;min-width:270px">${legenda}</div>
  </div>`;
}

/* ============ modal de composição de um número ============ */
function composicao(chave){
  const r = RES[S.mes], mesTxt = MES_NOME[S.mes];
  let titulo, sub, itens = [], total = 0;

  if(chave==='faturamento'){
    titulo = 'Faturamento'; sub = `Vendas fechadas em ${mesTxt}`;
    itens = VENDAS.filter(x=>x.m===S.mes).sort((a,b)=>b.val-a.val)
      .map(x=>({n:x.c, d:`${x.v} · ${String(x.dia).padStart(2,'0')}/${String(MESES_ORD.indexOf(x.m)+1).padStart(2,'0')}`, v:x.val}));
  }
  else if(chave==='base'){
    titulo = 'Custos vinculados às vendas'; sub = `Custo direto dos projetos de ${mesTxt}`;
    const vs = VENDAS.filter(x=>x.m===S.mes).sort((a,b)=>b.custo-a.custo);
    const k = r.base / vs.reduce((s,x)=>s+x.custo,0);
    itens = vs.map(x=>({n:x.c, d:'kit, instalação, vistoria e engenharia', v:x.custo*k}));
  }
  else if(chave==='com'){
    titulo = 'Comissões'; sub = `Pagas sobre as vendas de ${mesTxt}`;
    itens = [{n:'Vendedores', d:'percentual sobre o valor da venda', v:r.com*.44},
             {n:'Prospectadores', d:'valor fixo por venda', v:r.com*.56}];
  }
  else if(chave==='fixo' || chave==='imp'){
    const so = chave==='imp';
    titulo = so? 'Impostos' : 'Custos fixos e folha';
    sub = `Recorrentes de ${mesTxt}`;
    itens = Object.entries(r.fixos)
      .filter(([n])=> so ? /imposto/i.test(n) : !/imposto/i.test(n))
      .sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n, d:'', v}));
  }
  else if(chave==='naoprev'){
    titulo = 'Custos não previstos'; sub = `Lançados em ${mesTxt} sem vínculo com venda do mês`;
    itens = r.naoPrevItens.map(x=>({n:x.d, d:`${x.ref} · pago em ${x.dt}`, v:x.v}));
  }
  total = itens.reduce((s,x)=>s+x.v,0);

  const linhas = itens.map(x=>`<tr>
    <td style="padding-left:20px"><div class="nm2">${x.n}</div>${x.d?`<div style="color:var(--ink-faint);font-size:11.5px;margin-top:2px">${x.d}</div>`:''}</td>
    <td class="r mono" style="padding-right:8px;color:var(--ink-faint);width:64px">${(x.v/total*100).toFixed(1).replace('.',',')}%</td>

/* ============ CUSTOS ============ */
/* lançamentos de custo do mês, derivados da mesma fonte da DRE */
function lancamentosCusto(m){
  const r = RES[m], mm = String(MESES_ORD.indexOf(m)+1).padStart(2,'0');
  const vs = VENDAS.filter(x=>x.m===m);
  const k = r.base / (vs.reduce((s,x)=>s+x.custo,0)||1);
  const out = [];

  vs.forEach(v=>out.push({d:'Custos do projeto', o:'venda', ref:v.c,
    dt:`${String(v.dia).padStart(2,'0')}/${mm}`, v:v.custo*k, u:v.u}));

  out.push({d:'Comissões de vendedores', o:'comissão', ref:'sobre as vendas do mês',
    dt:`15/${mm}`, v:r.com*.44, u:'Matriz'});
  out.push({d:'Comissões de prospecção', o:'comissão', ref:'valor fixo por venda',
    dt:`15/${mm}`, v:r.com*.56, u:'Matriz'});

  Object.entries(r.fixos).sort((a,b)=>b[1]-a[1]).forEach(([n,v])=>{
    const o = /imposto/i.test(n) ? 'imposto'
            : /folha|labore|salári|salari|prospectador/i.test(n) ? 'folha' : 'fixo';
    out.push({d:n, o, ref:'recorrente', dt:`05/${mm}`, v, u:o==='folha'?'Matriz':'Unidade A'});
  });

  r.naoPrevItens.forEach(x=>out.push({d:x.d, o:'não previsto', ref:x.ref, dt:x.dt, v:x.v, u:'Unidade A'}));
  return out;
}

      <div class="field"><div class="fl">Vendedor</div><div class="seg"><button class="on">%</button><button>R$</button></div><div class="inp" style="max-width:100px">3,00</div></div>
      <div class="field"><div class="fl">SDR</div><div class="seg"><button class="on">%</button><button>R$</button></div><div class="inp" style="max-width:100px">1,00</div></div>
      <div class="field"><div class="fl">Prospectador</div><div class="seg"><button>%</button><button class="on">R$</button></div><div class="inp" style="max-width:100px">1.000,00</div></div>
      <div class="blk">Acesso da Jornada</div>
      <div style="display:flex;align-items:flex-start;gap:14px;background:var(--dourado-soft);border:1px solid rgba(254,209,22,.22);border-radius:12px;padding:15px 16px">
        <div class="switch" id="sw"><i></i></div>
        <div style="flex:1">
          <div style="font-weight:600;font-size:13.5px">Autorizar acesso da Jornada do M1lhão</div>
          <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.55">Ligada, seu mentor enxerga os números desta empresa. Desligada, ninguém de fora vê os valores.</div>
          <div style="font-size:12px;color:var(--ink-faint);margin-top:9px">Você liga e desliga quando quiser.</div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ============ roteador e interações ============ */
const TELAS = {visao, vendas, pend, custos, fixos, config};

function pintar(){
  const cnt = document.getElementById('cnt');
  cnt.innerHTML = TELAS[S.tela]();
  document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===S.tela));
  document.querySelector('#pilMes span').textContent =
    rotuloPeriodo().replace(' de 2026',' 2026').replace(/^(\d{2}) de /,'$1 ');
  const pu = document.getElementById('pilUni');
  pu.querySelector('span').textContent = S.unidade==='todas' ? 'Todas as unidades' : S.unidade;
  pu.classList.toggle('on', S.unidade!=='todas');
  ligar();
}

function ligar(){
  /* abrir venda */
  document.querySelectorAll('[data-venda]').forEach(tr=>
    tr.addEventListener('click',()=>abrir(tr.dataset.venda)));

  /* barras do mês a mês trocam o mês filtrado */
  document.querySelectorAll('[data-mes]').forEach(col=>
    col.addEventListener('click',()=>{ S.mes = col.dataset.mes; S.dia = null; pintar(); }));

  /* migalha */
  document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.zoom==='ano'){ window.__zoomMes = false; S.dia = null; }
    else { window.__zoomMes = true; S.dia = null; }
    pintar();
  }));

  /* pontos e rótulos do gráfico de linha */
  document.querySelectorAll('.lc').forEach(lc=>{
    const alvo = lc.dataset.lc;
    const dados = alvo==='vendas'
      ? (S.dia===null && !window.__zoomMes ? dadosAno() : dadosDias())
      : dadosDias();

    lc.querySelectorAll('.pt, .xl').forEach(el=>{
      const i = +el.dataset.idx;
      const p = dados[i];
      el.addEventListener('click',()=>{
        if(alvo!=='vendas') return;
        if(typeof p.chave === 'string'){          /* clicou num mês */
          if(!RES[p.chave]) return;
          S.mes = p.chave; S.dia = null; window.__zoomMes = true;
        } else {                                   /* clicou num dia */
          S.dia = S.dia===p.chave ? null : p.chave;
        }
        pintar();
      });
      if(el.classList.contains('pt')){
        el.addEventListener('mouseenter',ev=>{
          const d = document.getElementById('dica');
          d.innerHTML = `${p.rd||p.r}<span class="v">${BRL(p.v)}</span>`;
          const r = el.getBoundingClientRect();
          d.style.left = (r.left + r.width/2) + 'px';
          d.style.top  = (r.top + window.scrollY) + 'px';
          d.style.opacity = 1;
        });
        el.addEventListener('mouseleave',()=>document.getElementById('dica').style.opacity=0);
      }
    });
  });

  /* linhas da DRE abrem a composição */
  document.querySelectorAll('[data-abre]').forEach(el=>
    el.addEventListener('click',()=>abrirModal(composicao(el.dataset.abre))));

  /* fatia da rosca e linha da legenda: realce em par, clique abre a composição */
  const fats = document.querySelectorAll('[data-fat]');
  const realce = (k,on)=>fats.forEach(e=>{
    const meu = e.dataset.fat===k;
    e.classList.toggle('rea', on && meu);
    if(e.tagName==='circle') e.classList.toggle('apaga', on && !meu);
  });
  fats.forEach(el=>{
    el.addEventListener('mouseenter',()=>realce(el.dataset.fat,true));
    el.addEventListener('mouseleave',()=>realce(el.dataset.fat,false));
    el.addEventListener('click',()=>abrirModal(composicao(el.dataset.fat)));
  });

  /* chave de acesso */
  const sw = document.getElementById('sw');
  if(sw) sw.addEventListener('click',()=>sw.classList.toggle('off'));

  /* filtros da tela de Custos: filtram de verdade e recalculam os KPIs */
  document.querySelectorAll('[data-fc]').forEach(b=>b.addEventListener('click',()=>{
    FC[b.dataset.fc] = b.dataset.fv; pintar();
  }));

  /* abas de Fixos e Folha */
  document.querySelectorAll('[data-aba]').forEach(b=>b.addEventListener('click',()=>{
    S.abaFixos = b.dataset.aba; pintar();
  }));

  /* segmentados de percentual e valor */
  document.querySelectorAll('.seg').forEach(g=>g.querySelectorAll('button').forEach(b=>
    b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(o=>o.classList.remove('on'));b.classList.add('on')})));
}

function abrirModal(html){
  document.getElementById('mdl').innerHTML = html;
  const f = ()=>{
    const m = document.querySelector('#mdl .modal');
    if(!m) return;
    m.style.animation='pular .2s var(--ease) reverse forwards';
    setTimeout(()=>document.getElementById('mdl').innerHTML='',180);
  };
  const fe = document.getElementById('fecha');   if(fe) fe.onclick = f;
  const f2 = document.getElementById('fecha2');  if(f2) f2.onclick = f;
  document.getElementById('scrim').onclick = e => { if(e.target.id==='scrim') f(); };
  document.querySelectorAll('#mdl .seg').forEach(g=>g.querySelectorAll('button').forEach(b=>
    b.addEventListener('click',()=>{g.querySelectorAll('button').forEach(o=>o.classList.remove('on'));b.classList.add('on')})));
}
function abrir(i){ abrirModal(modalVenda(i)); }

function irPara(t){
  S.tela = TELAS[t] ? t : 'visao';
  if(S.tela!=='vendas') window.__zoomMes = false;
  pintar();
  try{ history.replaceState(null,'','#'+S.tela); }catch(e){}
}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>irPara(b.dataset.go)));

/* pílula de unidade percorre as unidades cadastradas */
const UNIDADES = ['todas','Matriz','Unidade A','Unidade B'];
document.getElementById('pilUni').addEventListener('click',()=>{
  S.unidade = UNIDADES[(UNIDADES.indexOf(S.unidade)+1) % UNIDADES.length];
  FC.unidade = S.unidade==='todas' ? 'todas' : S.unidade;
  pintar();
});
/* pílula de período limpa o recorte do dia */
document.getElementById('pilMes').addEventListener('click',()=>{
  if(S.dia!==null){ S.dia = null; pintar(); }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  const m = document.querySelector('#mdl .modal');
  if(m) document.getElementById('mdl').innerHTML='';
});

function rota(){
  const h = (location.hash||'#visao').slice(1);
  if(h==='login'){
    document.getElementById('v-login').classList.remove('hide');
    document.getElementById('app').classList.add('hide');
    return;
  }
  document.getElementById('v-login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  const m = h.match(/^venda-(\d+)$/);
  if(m){ S.tela='vendas'; pintar(); abrir(m[1]); return; }
  S.tela = TELAS[h] ? h : 'visao';
  if(S.tela!=='vendas') window.__zoomMes = false;
  pintar();
}
window.addEventListener('hashchange', rota);
rota();
</script>
